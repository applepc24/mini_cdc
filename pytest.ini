[pytest]
# 프로젝트 루트를 import 경로에 추가.
# Dockerfile의 `ENV PYTHONPATH=/app` 과 동일한 역할 —
# 이게 없으면 pytest는 tests/ 만 sys.path에 넣어서 `import app` 이 실패한다.
pythonpath = .

# 수집 범위를 tests/ 로 제한.
# 지정하지 않으면 rootdir부터 재귀로 훑어 .venv / frontend/node_modules /
# logs / results 까지 뒤진다(실측 243초).
testpaths = tests

addopts = -q --strict-markers
