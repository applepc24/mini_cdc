name: CI

# 최소 구성: 배포 전에 "명백히 깨진 코드"만 걸러내는 게이트.
# 팀 개발로 넘어가면 여기에 통합 테스트(멱등성/순서역전/Relay 동시성)를 추가한다.
on:
  pull_request:
  # cd.yml 이 배포 전 게이트로 이 워크플로를 그대로 호출한다(정의 중복 방지).
  workflow_call:

concurrency:
  # 연속 푸시 시 이전 실행을 취소해 러너 시간을 아낀다.
  # (CD는 반대로 cancel-in-progress: false — 배포 중 취소는 위험)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Dockerfile의 python:3.13-slim과 동일하게 유지할 것
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
