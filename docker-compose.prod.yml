services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mini-cdc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_cdc
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_cdc"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: mini-cdc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/2181'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mini-cdc-kafka
    depends_on:
      zookeeper:
        condition: service_healthy

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092"
      # NOTE: 외부에서 kafka 직접 쓸 거면 여기 localhost를 IP/도메인으로 바꿔야 함
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL","kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    container_name: mini-cdc-api
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/mini_cdc"
      KAFKA_BOOTSTRAP: "kafka:9092"
      KAFKA_TOPIC: "product-events"
      JWT_SECRET_KEY: "dev-secret"
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRE_MINUTES: "60"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_MODEL: "gpt-4o-mini"
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  relay:
    build: .
    container_name: mini-cdc-relay
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/mini_cdc"
      KAFKA_BOOTSTRAP: "kafka:9092"
      KAFKA_TOPIC: "product-events"
      KAFKA_DLQ_TOPIC: "product-events-dlq"
      RELAY_MAX_RETRY: "5"
      RELAY_BATCH_SIZE: "10"
      RELAY_POLL_INTERVAL_SEC: "1.0"
    command: ["python", "-m", "relay.main"]
    restart: unless-stopped

  consumer:
    build: .
    container_name: mini-cdc-consumer
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@db:5432/mini_cdc"
      KAFKA_BOOTSTRAP: "kafka:9092"
      KAFKA_TOPIC: "product-events"
      CONSUMER_GROUP: "mini-cdc-consumer-v2"
    command: ["python", "-m", "consumer.main"]
    restart: unless-stopped

volumes:
  pgdata:
